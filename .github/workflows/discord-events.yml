name: POT Bear Reminders

on:
  # Called externally by cron-job.org
  repository_dispatch:
    types:
      - bear1
      - bear2

  # Manual testing from GitHub Actions
  workflow_dispatch:
    inputs:
      event:
        description: "Bear event to test"
        required: true
        type: choice
        options:
          - bear1
          - bear2

jobs:
  bear-reminder:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      ROLE_ID_1: ${{ secrets.ROLE_ID_1 }}
      ROLE_ID_2: ${{ secrets.ROLE_ID_2 }}

      # MUST be an actual Bear day.
      BEAR1_START_DATE: "2026-08-23"
      BEAR2_START_DATE: "2026-08-22"

      BEAR_IMAGE_URL: "https://cdn.discordapp.com/emojis/1375520846407270561.png?size=256&quality=lossless"

    steps:
      - name: Check Bear cycle and send Discord reminder
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "POT Bear Reminder"
          echo "UTC date: $(date -u)"
          echo "Trigger: ${{ github.event_name }}"
          echo "=========================================="

          # ==========================================
          # DETERMINE EVENT
          # ==========================================

          EVENT="${{ github.event.action }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EVENT="${{ inputs.event }}"
          fi

          echo "Event: $EVENT"


          # ==========================================
          # EVENT CONFIGURATION
          # ==========================================

          case "$EVENT" in

            bear1)
              START_DATE="$BEAR1_START_DATE"
              BEAR_NAME="Bear Hunt 1"
              START_TIME="15:00 UTC"
              ;;

            bear2)
              START_DATE="$BEAR2_START_DATE"
              BEAR_NAME="Bear Hunt 2"
              START_TIME="19:00 UTC"
              ;;

            *)
              echo "ERROR: Unknown event: $EVENT"
              exit 1
              ;;

          esac


          # ==========================================
          # TRUE EVERY 2 DAYS CHECK
          # ==========================================

          every_two_days() {

            START_DATE="$1"

            START_SECONDS=$(date -u -d "$START_DATE 00:00:00" +%s)

            TODAY_DATE=$(date -u +%F)
            TODAY_SECONDS=$(date -u -d "$TODAY_DATE 00:00:00" +%s)

            DAYS_DIFFERENCE=$(( (TODAY_SECONDS - START_SECONDS) / 86400 ))

            echo "------------------------------------------"
            echo "Bear start date : $START_DATE"
            echo "Today           : $TODAY_DATE"
            echo "Days difference : $DAYS_DIFFERENCE"
            echo "------------------------------------------"

            # Do not run before cycle begins
            if [ "$DAYS_DIFFERENCE" -lt 0 ]; then
              return 1
            fi

            # 0, 2, 4, 6, 8...
            if [ $((DAYS_DIFFERENCE % 2)) -eq 0 ]; then
              return 0
            fi

            return 1
          }


          # ==========================================
          # VERIFY TODAY IS A BEAR DAY
          # ==========================================

          if ! every_two_days "$START_DATE"; then

            echo "=========================================="
            echo "NOT A BEAR DAY"
            echo "Discord message will NOT be sent."
            echo "=========================================="

            exit 0

          fi


          echo "=========================================="
          echo "TODAY IS A BEAR DAY"
          echo "Sending $BEAR_NAME reminder"
          echo "=========================================="


          # ==========================================
          # CHECK DISCORD WEBHOOK
          # ==========================================

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: DISCORD_WEBHOOK_URL secret missing."
            exit 1
          fi


          # ==========================================
          # CLEAN ROLE IDS
          # ==========================================

          ROLE_ID_1=$(printf '%s' "$ROLE_ID_1" | tr -d '[:space:]')
          ROLE_ID_2=$(printf '%s' "$ROLE_ID_2" | tr -d '[:space:]')

          ROLE_ID_1=$(printf '%s' "$ROLE_ID_1" | sed -E 's/^<@&([0-9]+)>$/\1/')
          ROLE_ID_2=$(printf '%s' "$ROLE_ID_2" | sed -E 's/^<@&([0-9]+)>$/\1/')


          # ==========================================
          # VALIDATE ROLE IDS
          # ==========================================

          if [ -n "$ROLE_ID_1" ] && [[ ! "$ROLE_ID_1" =~ ^[0-9]+$ ]]; then
            echo "ERROR: ROLE_ID_1 is invalid."
            exit 1
          fi

          if [ -n "$ROLE_ID_2" ] && [[ ! "$ROLE_ID_2" =~ ^[0-9]+$ ]]; then
            echo "ERROR: ROLE_ID_2 is invalid."
            exit 1
          fi


          # ==========================================
          # BUILD ROLE PING
          # ==========================================

          ROLE_PING=""

          if [ -n "$ROLE_ID_1" ]; then
            ROLE_PING="<@&$ROLE_ID_1>"
          fi

          if [ -n "$ROLE_ID_2" ]; then

            if [ -n "$ROLE_PING" ]; then
              ROLE_PING="$ROLE_PING <@&$ROLE_ID_2>"
            else
              ROLE_PING="<@&$ROLE_ID_2>"
            fi

          fi


          # Exact roles Discord is allowed to ping
          ALLOWED_ROLES=$(jq -cn \
            --arg r1 "$ROLE_ID_1" \
            --arg r2 "$ROLE_ID_2" \
            '[$r1, $r2] | map(select(length > 0))')


          # ==========================================
          # CREATE DISCORD PAYLOAD
          # ==========================================

          PAYLOAD=$(jq -n \
            --arg ping "$ROLE_PING" \
            --arg bear "$BEAR_NAME" \
            --arg start "$START_TIME" \
            --arg image "$BEAR_IMAGE_URL" \
            --argjson roles "$ALLOWED_ROLES" \
            '{
              username: "POT",

              content: $ping,

              allowed_mentions: {
                roles: $roles
              },

              embeds: [
                {
                  title: "🚨 MISSION ALERT: POT BEAR INBOUND 🚨",

                  description:
                    ("**Attention, Commanders!**\n\n🐻 **" + $bear + " — BEAR TRAP POT** will commence in **15 minutes**."),

                  color: 15158332,

                  image: {
                    url: $image
                  },

                  fields: [
                    {
                      name: "🕒 START TIME",
                      value: ("**" + $start + "**"),
                      inline: true
                    },
                    {
                      name: "⏳ COUNTDOWN",
                      value: "**15 Minutes**",
                      inline: true
                    },
                    {
                      name: "✅ CHECKLIST",
                      value: "• Get online\n• Check your formations\n• Activate required buffs\n• Verify your heroes",
                      inline: false
                    }
                  ]
                }
              ]
            }')


          # ==========================================
          # SEND TO DISCORD
          # ==========================================

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord-response.txt \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL")


          echo "Discord HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

            echo "ERROR: Discord webhook failed."
            cat /tmp/discord-response.txt

            exit 1

          fi

          echo "Discord reminder sent successfully."
