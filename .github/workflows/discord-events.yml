name: POT Discord Event Reminders

on:
  schedule:
    # =====================================================
    # 🐻 BEAR HUNT 1
    # Event: 15:00 UTC
    # Reminder: 14:45 UTC
    # Script checks whether today is a Bear day
    # =====================================================
    - cron: "45 14 * * *"

    # =====================================================
    # 🐻 BEAR HUNT 2
    # Event: 19:00 UTC
    # Reminder: 18:45 UTC
    # Script checks whether today is a Bear day
    # =====================================================
    - cron: "45 18 * * *"

    # =====================================================
    # EVENT 3
    # Every day at 23:50 UTC
    # =====================================================
    - cron: "50 23 * * *"

    # =====================================================
    # EVENT 4
    # Every Sunday at 23:45 UTC
    # =====================================================
    - cron: "45 23 * * 0"

  # =======================================================
  # MANUAL TEST BUTTON
  # GitHub -> Actions -> KS Discord Event Reminders
  # -> Run workflow
  # =======================================================
  workflow_dispatch:
    inputs:
      event:
        description: "Choose event to test"
        required: true
        type: choice
        options:
          - bear1
          - bear2
          - event3
          - event4


jobs:
  discord-reminder:
    runs-on: ubuntu-latest

    env:
      # ===================================================
      # DISCORD WEBHOOK
      # Create GitHub secret:
      # DISCORD_WEBHOOK_URL
      # ===================================================
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ALLIANCE: ${{ secrets.ALLIANCE }}
      # ===================================================
      # BEAR CYCLE START DATES
      #
      # These MUST be dates when the Bear actually happens.
      #
      # Example with 2026-08-22:
      #
      # Aug 22 = Bear
      # Aug 23 = No Bear
      # Aug 24 = Bear
      # Aug 25 = No Bear
      # Aug 26 = Bear
      #
      # If Bear 1 and Bear 2 happen on the same days,
      # keep both dates the same.
      # ===================================================
      BEAR1_START_DATE: "2026-08-22"
      BEAR2_START_DATE: "2026-08-22"

      # ===================================================
      # BEAR IMAGE
      # ===================================================
      BEAR_IMAGE_URL: "https://cdn.discordapp.com/emojis/1375520846407270561.png?size=256&quality=lossless"

      # ===================================================
      # DISCORD ROLE PINGS (2 ROLES)
      #
      # Put the two Discord role IDs below.
      # Leave either one blank if you do not want that role pinged.
      #
      # Example:
      # DISCORD_ROLE_ID_1: "123456789012345678"
      # DISCORD_ROLE_ID_2: "987654321098765432"
      # ===================================================
      DISCORD_ROLE_ID_1: ${{ secrets.ROLE_ID_1 }}
      DISCORD_ROLE_ID_2: ${{ secrets.ROLE_ID_2 }}

    steps:

      - name: Send Discord Event Reminder
        shell: bash

        run: |
          set -u

          echo "=========================================="
          echo "KS Discord Event Reminder"
          echo "=========================================="
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC Time: $(date -u)"
          echo "=========================================="

          # =================================================
          # GET THE SCHEDULE THAT TRIGGERED THIS WORKFLOW
          # =================================================

          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_EVENT="${{ inputs.event }}"
          IS_MANUAL="false"


          # =================================================
          # MANUAL TEST MODE
          # =================================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            IS_MANUAL="true"

            echo "Manual test selected: $MANUAL_EVENT"

            case "$MANUAL_EVENT" in

              bear1)
                SCHEDULE="45 14 * * *"
                ;;

              bear2)
                SCHEDULE="45 18 * * *"
                ;;

              event3)
                SCHEDULE="50 23 * * *"
                ;;

              event4)
                SCHEDULE="45 23 * * 0"
                ;;

              *)
                echo "ERROR: Unknown manual event."
                exit 1
                ;;

            esac

          fi


          echo "Selected schedule: $SCHEDULE"


          # =================================================
          # CHECK DISCORD WEBHOOK
          # =================================================

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then

            echo "ERROR: DISCORD_WEBHOOK_URL is missing."
            echo "Create it in:"
            echo "GitHub -> Settings -> Secrets and variables -> Actions"

            exit 1

          fi


          # =================================================
          # EVERY 2 DAYS CHECK
          #
          # FIXED VERSION
          #
          # This calculates the actual number of days since
          # the Bear cycle start date.
          # =================================================

          every_two_days() {

            START_DATE="$1"


            # Manual tests should always send
            if [ "$IS_MANUAL" = "true" ]; then

              echo "Manual test: bypassing Bear day check."

              return 0

            fi


            START_SECONDS=$(date -u -d "$START_DATE 00:00:00" +%s)

            TODAY_DATE=$(date -u +%F)

            TODAY_SECONDS=$(date -u -d "$TODAY_DATE 00:00:00" +%s)


            # IMPORTANT:
            # Correct Bash arithmetic syntax is $(( ... ))
            DAYS_DIFFERENCE=$(( (TODAY_SECONDS - START_SECONDS) / 86400 ))


            echo "Bear cycle start: $START_DATE"
            echo "Today: $TODAY_DATE"
            echo "Days difference: $DAYS_DIFFERENCE"


            # Don't run before the cycle starts
            if [ "$DAYS_DIFFERENCE" -lt 0 ]; then

              echo "Bear cycle has not started yet."

              return 1

            fi


            # 0, 2, 4, 6, 8...
            if [ $((DAYS_DIFFERENCE % 2)) -eq 0 ]; then

              echo "Today IS a Bear event day."

              return 0

            else

              echo "Today is NOT a Bear event day."

              return 1

            fi
          }


          # =================================================
          # SEND JSON PAYLOAD TO DISCORD
          # =================================================

          send_discord() {

            PAYLOAD="$1"

            echo "Sending Discord message..."


            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/discord-response.txt \
              --write-out "%{http_code}" \
              -H "Content-Type: application/json" \
              --data-binary "$PAYLOAD" \
              "$DISCORD_WEBHOOK_URL")


            echo "Discord HTTP status: $HTTP_CODE"


            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

              echo "ERROR: Discord rejected the webhook."

              cat /tmp/discord-response.txt

              exit 1

            fi


            echo "Discord message sent successfully."
          }


          # =================================================
          # BUILD TWO ROLE PINGS
          # =================================================

          ROLE_PING=""
          ROLE_IDS_JSON="[]"

          if [ -n "$DISCORD_ROLE_ID_1" ]; then
            ROLE_PING="<@&$DISCORD_ROLE_ID_1>"
            ROLE_IDS_JSON=$(jq -n --arg r1 "$DISCORD_ROLE_ID_1" '[ $r1 ]')
          fi

          if [ -n "$DISCORD_ROLE_ID_2" ]; then
            if [ -n "$ROLE_PING" ]; then
              ROLE_PING="$ROLE_PING <@&$DISCORD_ROLE_ID_2>"
            else
              ROLE_PING="<@&$DISCORD_ROLE_ID_2>"
            fi

            ROLE_IDS_JSON=$(jq -n \
              --argjson roles "$ROLE_IDS_JSON" \
              --arg r2 "$DISCORD_ROLE_ID_2" \
              '$roles + [$r2]')
          fi

          echo "Role ping text: $ROLE_PING"
          echo "Allowed role IDs: $ROLE_IDS_JSON"


          # =================================================
          # 🐻 BEAR HUNT 1
          #
          # Starts: 15:00 UTC
          # Alert:  14:45 UTC
          # =================================================

          if [ "$SCHEDULE" = "45 14 * * *" ]; then

            echo "------------------------------------------"
            echo "Processing Bear Hunt 1"
            echo "------------------------------------------"


            if every_two_days "$BEAR1_START_DATE"; then


              PAYLOAD=$(jq -n \
                --arg ping "$ROLE_PING" \
                --argjson roles "$ROLE_IDS_JSON" \
                --arg image "$BEAR_IMAGE_URL" \
                '{
                  username: "KS Mission Control",

                  content: $ping,

                  allowed_mentions: {
                    parse: [],
                    roles: $roles
                  },

                  embeds: [
                    {
                      title: "🚨 MISSION ALERT: POT BEAR INBOUND 🚨",

                      description:
                        "**Attention, Commanders!**\n\n🐻 **Bear Hunt 1 — BEAR TRAP POT** will commence in **15 minutes**.",

                      color: 15158332,

                      image: {
                        url: $image
                      },

                      fields: [
                        {
                          name: "🕒 START TIME",
                          value: "**19:00 UTC**",
                          inline: true
                        },
                        {
                          name: "⏳ COUNTDOWN",
                          value: "**15 Minutes**",
                          inline: true
                        },
                        {
                          name: "✅ CHECKLIST",
                          value: "• Get online\n• Check your formations\n• Activate required buffs\n• Verify your heroes",
                          inline: false
                        }
                      ],
                      timestamp: (now | todate)
                    }
                  ]
                }')


              send_discord "$PAYLOAD"


            else

              echo "Bear Hunt 1 does not run today."

            fi


            exit 0

          fi


          # =================================================
          # 🐻 BEAR HUNT 2
          #
          # Starts: 19:00 UTC
          # Alert:  18:45 UTC
          # =================================================

          if [ "$SCHEDULE" = "45 18 * * *" ]; then

            echo "------------------------------------------"
            echo "Processing Bear Hunt 2"
            echo "------------------------------------------"


            if every_two_days "$BEAR2_START_DATE"; then


              PAYLOAD=$(jq -n \
                --arg ping "$ROLE_PING" \
                --argjson roles "$ROLE_IDS_JSON" \
                --arg image "$BEAR_IMAGE_URL" \
                '{
                  username: "KS Mission Control",

                  content: $ping,

                  allowed_mentions: {
                    parse: [],
                    roles: $roles
                  },

                  embeds: [
                    {
                      title: "🚨 MISSION ALERT: POT BEAR INBOUND 🚨",

                      description:
                        "**Attention, Commanders!**\n\n🐻 **Bear Hunt 2 — BEAR TRAP POT** will commence in **15 minutes**.",

                      color: 15158332,

                      image: {
                        url: $image
                      },

                      fields: [
                        {
                          name: "🕒 START TIME",
                          value: "**19:00 UTC**",
                          inline: true
                        },
                        {
                          name: "⏳ COUNTDOWN",
                          value: "**15 Minutes**",
                          inline: true
                        },
                        {
                          name: "✅ CHECKLIST",
                          value: "• Get online\n• Check your formations\n• Activate required buffs\n• Verify your heroes",
                          inline: false
                        }
                      ],

                      timestamp: (now | todate)
                    }
                  ]
                }')


              send_discord "$PAYLOAD"


            else

              echo "Bear Hunt 2 does not run today."

            fi


            exit 0

          fi


          # =================================================
          # 📅 EVENT 3
          #
          # Every day at 23:50 UTC
          # =================================================

          if [ "$SCHEDULE" = "50 23 * * *" ]; then

            echo "------------------------------------------"
            echo "Processing Event 3"
            echo "------------------------------------------"


            PAYLOAD=$(jq -n \
              --arg ping "$ROLE_PING" \
              --argjson roles "$ROLE_IDS_JSON" \
              '{
                username: "KS Mission Control",

                content: $ping,

                allowed_mentions: {
                  parse: [],
                  roles: $roles
                },

                embeds: [
                  {
                    title: "📢 DAILY EVENT ALERT",

                    description:
                      "**Attention, Commanders!**\n\nThe daily event is starting now.",

                    color: 3447003,

                    fields: [
                      {
                        name: "🕒 TIME",
                        value: "**23:50 UTC**",
                        inline: true
                      },
                      {
                        name: "📅 SCHEDULE",
                        value: "**Every Day**",
                        inline: true
                      },
                      {
                        name: "⚔️ STATUS",
                        value: "**Event Active**",
                        inline: false
                      },
                      {
                        name: "📡 ORDERS",
                        value: "> Report in and prepare for the event.",
                        inline: false
                      }
                    ],

                    footer: {
                      text: "Mission Control • KS Operations"
                    },

                    timestamp: (now | todate)
                  }
                ]
              }')


            send_discord "$PAYLOAD"

            exit 0

          fi


          # =================================================
          # 📅 EVENT 4
          #
          # Every Sunday at 23:45 UTC
          # =================================================

          if [ "$SCHEDULE" = "45 23 * * 0" ]; then

            echo "------------------------------------------"
            echo "Processing Event 4"
            echo "------------------------------------------"


            PAYLOAD=$(jq -n \
              --arg ping "$ROLE_PING" \
              --argjson roles "$ROLE_IDS_JSON" \
              '{
                username: "KS Mission Control",

                content: $ping,

                allowed_mentions: {
                  parse: [],
                  roles: $roles
                },

                embeds: [
                  {
                    title: "🚨 SUNDAY EVENT ALERT",

                    description:
                      "**Attention, Commanders!**\n\nThe weekly Sunday event is starting now.",

                    color: 10181046,

                    fields: [
                      {
                        name: "🕒 TIME",
                        value: "**23:45 UTC**",
                        inline: true
                      },
                      {
                        name: "📅 SCHEDULE",
                        value: "**Every Sunday**",
                        inline: true
                      },
                      {
                        name: "⚔️ STATUS",
                        value: "**Event Active**",
                        inline: false
                      },
                      {
                        name: "📡 ORDERS",
                        value: "> Report in and prepare for the weekly operation.",
                        inline: false
                      }
                    ],

                    footer: {
                      text: "Mission Control • KS Operations"
                    },

                    timestamp: (now | todate)
                  }
                ]
              }')


            send_discord "$PAYLOAD"

            exit 0

          fi


          # =================================================
          # NO MATCH
          # =================================================

          echo "ERROR: No matching event schedule."
          echo "Schedule was: $SCHEDULE"

          exit 1
